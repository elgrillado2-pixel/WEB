<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/Estilos.css">
    <title>Formulario</title>
</head>
<body>
    <header>
        <h1>Mi primera página WEB de Lenguaje de marcas</h1>
        <nav>
            <ul>
                <li><a href="Horario-Clase.html">Horario</a></li>
                <li><a href="Index.html">Inicio</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Formulario de Contacto</h1>
        <form>
            <fieldset>
                <legend>Datos personales</legend>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required><br><br>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono"><br><br>

                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="4" cols="50"></textarea><br><br>

                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha"><br><br>

                <input type="submit" value="Enviar">
            </fieldset>
            <fieldset>
                <legend>Preferencias de contacto</legend>
                <label for="contacto">¿Cómo prefieres que te contactemos?</label><br>
                <input type="radio" id="email_contacto" name="contacto" value="email">
                <label for="email_contacto">Correo electrónico</label><br>
                <input type="radio" id="telefono_contacto" name="contacto" value="telefono">
                <label for="telefono_contacto">Teléfono</label><br><br>

                <label for="suscripcion">¿Deseas suscribirte a nuestra pagina?</label>
                <input type="checkbox" id="suscripcion" name="suscripcion"><br><br>

                <input type="submit" value="Enviar preferencias">
            </fieldset>
        </form>
    </main>
    <!-- Pie de página -->
    <footer>
        <p>CIFP Virgen de Gracia</p>
        <p>
            Contacto:
            <a href="mailto:elgrillado2@gmail.com">elgrillado2@gmail.com</a>
        </p>
    </footer>
</body>
</html>
