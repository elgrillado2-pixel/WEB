<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Piedra-Papel-Tijeras</title>
    <script src="Java/Piedra-Papel-Tijera.js"></script>
</head>
    <body>
        <main>
            <h1>Piedra, Papel, Tijera </h1>
            <p class="instrucciones">Elige una opcion y juega contra la maquina</p>

         <div class="opciones">
             <button type="button" onclick="juego('piedra')">Piedra</button>
                <button type="button" onclick="juego('papel')">Papel</button>
                <button type="button" onclick="juego('tijera')">Tijera</button>
         </div>

         <p id="marcador">Partidas jugadas: 0</p>
            <p id="ganadas">Partidas ganadas: 0</p>
            <p id="empatadas">Partidas empatadas: 0</p>
            <p id="perdidas">Partidas perdidas: 0</p>

            <section id="resultado">
                <h2>Resultado</h2>
                <p id="Jugada-Jugador">Tu jugada aparecera aquí.</p>
                <p id="Jugada-Maquina">La jugada de la maquina aparecera aquí.</p>
                <p id="Mensaje"></p>
            </section>
        </main>
    
    </body>
</html>
